# Actos web — continuous integration (ROADMAP Phase 8, D-10).
#
# `check` and `audit` run in parallel; `image` only runs when both are green,
# so a broken tree never reaches the registry. The image tag is immutable
# (`sha-<short>`), which is what makes the deploy/rollback workflow a tag
# swap rather than a rebuild.
#
# NOTE on the mocked Playwright suite (`pnpm test:e2e`): the script and the
# harness exist (`playwright.config.ts`), but as of this commit 14 of its 40
# assertions are stale against the redesigned app (English-default copy,
# changed 404/route behavior — see ROADMAP D-09 and the kill list). Its specs
# are Turkish-era and expect UI text the app no longer renders. Wiring it in
# now would make `main` permanently red, so it is deliberately left out
# until the specs are refreshed. The real-backend suite (`test:e2e:real`) is
# not wired either: it needs a seeded live API and belongs to the staging
# track (D-12).

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  # A newer push to the same ref cancels the older run: pnpm install and the
  # Next.js build are the expensive part, and stale runs only queue up.
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Lint, Typecheck, Test & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Biome check
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Run tests
        run: pnpm test

      - name: Build Next.js
        run: pnpm build
        env:
          ACTOS_API_URL: "http://127.0.0.1:3100"
          ACTOS_SITE_URL: "http://localhost:3000"
          NEXT_PUBLIC_ACTOS_API_URL: "http://127.0.0.1:3100"

  audit:
    name: Audit production dependencies
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.32.1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # `--prod` because dev-only advisories do not ship in the runtime image
      # (ROADMAP D-13 lists "pnpm audit --prod clean" as a launch gate).
      - name: Audit
        run: pnpm audit --prod

  image:
    name: Build & push image
    runs-on: ubuntu-latest
    needs: [check, audit]
    # PRs only prove the image builds; a fork must never get registry write
    # access, so `push` is gated on the event below.
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/actos-dev/frontend
          # `sha-<short>` is always produced so deploys pin an immutable tag
          # and rollback is a tag change (see .github/workflows/deploy.yml).
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build & push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Public routing config only. NEXT_PUBLIC_ACTOS_API_URL is embedded
          # in the browser bundle at build time; ACTOS_MEDIA_URL shapes
          # next.config.ts remotePatterns and proxy.ts CSP at build time.
          build-args: |
            ACTOS_API_URL=http://api:3100
            ACTOS_SITE_URL=https://actos.com.tr
            NEXT_PUBLIC_ACTOS_API_URL=https://api.actos.com.tr
            ACTOS_MEDIA_URL=https://media.actos.com.tr
          cache-from: type=gha
          cache-to: type=gha,mode=max
